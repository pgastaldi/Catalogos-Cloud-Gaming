<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AWG Games — CATÁLOGO DE VIDEOJUEGOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
/* --br  color principal          → HEADER (fondo), acentos, chips activos, CTA
   --onbr contraste sobre --br     → todo lo que se apoya encima del acento
   --bg   color de fondo           → resto de la página; de él derivan las superficies
   --fb-bg barra de filtros        → mismo fondo, apenas más oscuro
   --tx / --mu color de tipografía → TODOS los textos del cuerpo */
:root{--br:#0000ff;--onbr:#f0f0f8;--bg:#c1c1f1;--hdr-bg:#0000ff;--hdr-mu:color-mix(in srgb,#f0f0f8 72%,transparent);--hdr-fld:color-mix(in srgb,#f0f0f8 12%,transparent);--hdr-bd:color-mix(in srgb,#f0f0f8 30%,transparent);--fb-bg:color-mix(in srgb,#c1c1f1 92%,#000 8%);--main-bg:color-mix(in srgb,#c1c1f1 100%,#000 0%);--s1:color-mix(in srgb,#c1c1f1 88%,#fff 5%);--s2:color-mix(in srgb,#c1c1f1 80%,#fff 3%);--s3:color-mix(in srgb,#c1c1f1 70%,#000 5%);--bd:#16167f;--bd2:#16167fcc;--tx:#000000;--mu:#00000099;--ff:'Kolbi Sans Regular','Montserrat',system-ui,-apple-system,'Segoe UI',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--main-bg);color:var(--tx);font-family:var(--ff);font-size:15px;height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
/* ── HEADER: fondo = color principal; su contenido usa --onbr ─────────────── */
#hdr{background:var(--hdr-bg);border-bottom:1px solid var(--hdr-bd);padding:0 24px;flex-shrink:0;z-index:100}
#hi{display:flex;align-items:center;gap:16px;height:70px}
#logo{display:flex;align-items:center;gap:12px;flex-shrink:0}
#ln{font-family:var(--ff);font-size:24px;font-weight:800;letter-spacing:-.3px;color:var(--onbr);line-height:1.1}
#ls{font-size:11px;font-weight:600;color:var(--hdr-mu);letter-spacing:2px;text-transform:uppercase;margin-top:3px}
#sw{flex:1;position:relative;max-width:440px}
#si{width:100%;background:var(--hdr-fld);border:1px solid var(--hdr-bd);border-radius:8px;padding:11px 15px 11px 42px;color:var(--onbr);font-family:var(--ff);font-size:15px;outline:none;transition:border-color .2s}
#si:focus{border-color:var(--onbr)}#si::placeholder{color:var(--hdr-mu)}
.sic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--hdr-mu);pointer-events:none}
#gc{margin-left:auto;font-size:14px;font-weight:500;color:var(--hdr-mu);flex-shrink:0;white-space:nowrap}
/* ── SELECTOR DE IDIOMA (header) ──────────────────────────────────────────
   Se rellena desde JS solo si el catálogo trae más de un idioma embebido. */
#lgw{position:relative;flex-shrink:0;display:none}
#lgw.on{display:block}
#lgb{display:flex;align-items:center;gap:6px;background:var(--hdr-fld);border:1px solid var(--hdr-bd);border-radius:8px;padding:7px 10px;font-family:var(--ff);font-size:13px;font-weight:600;color:var(--onbr);cursor:pointer;white-space:nowrap;transition:border-color .15s}
#lgb:hover{border-color:var(--onbr)}
#lgm{position:absolute;top:calc(100% + 5px);right:0;background:var(--s2);border:1px solid var(--bd2);border-radius:9px;padding:5px;min-width:132px;box-shadow:0 14px 40px rgba(0,0,0,.6);display:none;z-index:200}
#lgm.open{display:block}
.lgo{display:block;width:100%;text-align:left;background:transparent;border:none;border-radius:6px;padding:8px 11px;font-family:var(--ff);font-size:13px;font-weight:500;color:var(--mu);cursor:pointer;white-space:nowrap;transition:all .12s}
.lgo:hover{background:var(--s3);color:var(--tx)}
.lgo.on{background:var(--br);color:var(--onbr);font-weight:700}
/* ── BARRA DE FILTROS ─────────────────────────────────────────────────────
   Compacta (42px) y scrolleable en horizontal SIEMPRE: en mobile con el dedo,
   en PC con la rueda del mouse (ver whx()), arrastrando, o con las flechas.
   La scrollbar nativa se oculta; el degradado en los bordes (#fb::before/after)
   avisa que hay más filtros fuera de vista. */
#fb{background:var(--fb-bg);border-bottom:1px solid var(--bd);flex-shrink:0;z-index:50;position:relative}
#fi{display:flex;align-items:center;gap:6px;padding:0 20px;height:42px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;overscroll-behavior-x:contain}
#fi::-webkit-scrollbar{display:none}
#fi.grab{cursor:grabbing;scroll-behavior:auto}
#fb::before,#fb::after{content:"";position:absolute;top:0;bottom:1px;width:36px;pointer-events:none;z-index:2;opacity:0;transition:opacity .18s}
#fb::before{left:0;background:linear-gradient(to right,var(--fb-bg),transparent)}
#fb::after{right:0;background:linear-gradient(to left,var(--fb-bg),transparent)}
#fb.ovl::before{opacity:1}#fb.ovr::after{opacity:1}
/* Flechas: solo con puntero fino (mouse/trackpad). En touch sobran. */
.fnav{position:absolute;top:0;bottom:1px;width:26px;display:none;align-items:center;justify-content:center;background:var(--fb-bg);border:none;color:var(--mu);cursor:pointer;z-index:3;padding:0;transition:color .15s}
.fnav:hover{color:var(--br)}
.fnav.l{left:0}.fnav.r{right:0}
@media(hover:hover) and (pointer:fine){
  #fb.ovl .fnav.l,#fb.ovr .fnav.r{display:flex}
  #fb.ovl::before{left:26px}#fb.ovr::after{right:26px}
}
.fg{display:flex;align-items:center;gap:5px;flex-shrink:0}
.fl{font-size:9.5px;font-weight:700;color:var(--mu);letter-spacing:1px;text-transform:uppercase;white-space:nowrap;padding-right:2px}
.sp{width:1px;height:15px;background:var(--bd2);flex-shrink:0;margin:0 4px}
.chip{background:var(--s2);border:1px solid var(--bd2);border-radius:100px;padding:4px 11px;font-size:12px;font-weight:500;color:var(--mu);cursor:pointer;white-space:nowrap;transition:all .15s;user-select:none;flex-shrink:0}
.chip:hover{border-color:var(--br);color:var(--tx)}.chip.on{background:var(--br);border-color:var(--br);color:var(--onbr)}
#clr{display:none;align-items:center;gap:4px;background:transparent;border:1px solid var(--bd2);border-radius:100px;padding:4px 11px;font-family:var(--ff);font-size:12px;font-weight:600;color:var(--br);cursor:pointer;white-space:nowrap;flex-shrink:0;margin-left:4px;transition:all .15s}
#clr.show{display:flex}
.dd{position:relative;flex-shrink:0}
.ddbtn{background:var(--s2);border:1px solid var(--bd2);border-radius:100px;padding:4px 11px;font-size:12px;font-weight:500;color:var(--mu);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;user-select:none;transition:all .15s}
.ddbtn.has{border-color:var(--br);color:var(--br)}.arr{transition:transform .2s}.ddbtn.open .arr{transform:rotate(180deg)}
#genre-portal{position:fixed;z-index:9999;display:none}#genre-portal.open{display:block}
#gp{background:var(--s2);border:1px solid var(--bd2);border-radius:10px;padding:11px;display:flex;flex-wrap:wrap;gap:6px;max-width:400px;box-shadow:0 16px 48px rgba(0,0,0,.8)}
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--main-bg)}
#main{max-width:1280px;margin:0 auto;padding:28px 24px 56px}
.sec{margin-bottom:44px}.sh{display:flex;align-items:baseline;gap:8px;margin-bottom:16px}
.dot{color:var(--br);font-size:16px}.tit{font-family:var(--ff);font-size:26px;font-weight:800;letter-spacing:-.4px;text-transform:uppercase}.cnt{font-size:13px;font-weight:500;color:var(--mu);margin-left:5px}
.glg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.gmd{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:14px}
.gsm{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s}
.card:hover{transform:translateY(-3px);border-color:var(--bd2);box-shadow:0 10px 28px rgba(0,0,0,.55)}
/* La portada se muestra COMPLETA (object-fit:contain) sobre una copia
   difuminada de sí misma, para que ninguna imagen aparezca recortada. */
.ciw{position:relative;width:100%;padding-top:125%;overflow:hidden;background:var(--s3)}
.cbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(20px) brightness(.45);transform:scale(1.25)}
.ci{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;transition:transform .28s;z-index:1}
.card:hover .ci{transform:scale(1.04)}
.cph{position:absolute;inset:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--ff);font-weight:800;color:var(--br);font-size:52px;opacity:.3}
.cov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.55) 0%,transparent 42%);z-index:2;pointer-events:none}
.cnv{position:absolute;top:8px;left:8px;background:var(--br);color:var(--onbr);font-size:10px;font-weight:700;padding:4px 8px;border-radius:4px;letter-spacing:1.2px;z-index:3}
.cpe{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;font-weight:700;padding:3px 7px;border-radius:4px;border:1px solid rgba(255,255,255,.12);z-index:3}
.cb{padding:12px 13px 13px}
.ct{font-family:var(--ff);font-size:16px;font-weight:700;letter-spacing:-.2px;line-height:1.25;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.cp{font-size:13px;color:var(--mu);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctgs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.ctg{background:var(--s3);border:1px solid var(--bd);border-radius:5px;font-size:11px;font-weight:500;color:var(--mu);padding:3px 8px;white-space:nowrap}
.ctg.f{border-color:rgba(50,200,100,.3);color:rgba(50,200,100,.9)}
.cic{display:flex;flex-wrap:wrap;gap:7px}.ib{display:flex;flex-direction:column;align-items:center;gap:3px}.ib svg{opacity:.65}.ib span{font-size:9px;font-weight:600;color:var(--mu)}
#pov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9990;display:none;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(10px)}
#pov.open{display:flex}
#pop{background:var(--s1);border:1px solid var(--bd2);border-radius:16px;max-width:820px;width:100%;overflow:hidden;animation:pi .18s ease;position:relative;display:flex;flex-direction:column;max-height:92vh}
@keyframes pi{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
/* --pcp separa la portada del borde del modal para que no la recorte el redondeo */
#pt{display:flex;flex-shrink:0;min-height:0}#pcol{--pcp:16px;width:calc(240px + var(--pcp));flex-shrink:0;position:relative;padding:var(--pcp) 0 0 var(--pcp)}
/* La portada se ve COMPLETA sin bandas: el contenedor no impone proporción, toma
   la altura natural de la imagen a 240px de ancho. El fondo difuminado solo asoma
   en el caso extremo de una portada tan alta que choque con el max-height. */
#piw{position:relative;width:100%;overflow:hidden;background:var(--s3);display:block;line-height:0;border-radius:10px}
#pbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(20px) brightness(.45);transform:scale(1.25)}
#pim{position:relative;z-index:1;display:block;width:100%;height:auto;max-height:70vh;object-fit:contain}
#pph{width:100%;aspect-ratio:3/4;background:var(--s3);border-radius:10px;display:none;align-items:center;justify-content:center;font-family:var(--ff);font-size:76px;font-weight:800;color:var(--br);opacity:.2}
#pnvb{position:absolute;top:calc(var(--pcp) + 10px);left:calc(var(--pcp) + 10px);background:var(--br);color:var(--onbr);font-size:11px;font-weight:700;padding:4px 10px;border-radius:4px;letter-spacing:1.2px;display:none;z-index:3}
#pmeta{flex:1;padding:22px 24px 18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;min-width:0}
#ptit{font-family:var(--ff);font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1.12}#ppub{font-size:15px;color:var(--mu);margin-top:4px}
#ptgs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ptag{border-radius:6px;font-size:13px;font-weight:600;padding:6px 14px;border:1px solid var(--bd2);background:var(--s3);color:var(--tx);white-space:nowrap}
.ptag.genre{background:color-mix(in srgb,var(--br) 15%,transparent);border-color:color-mix(in srgb,var(--br) 45%,transparent);color:var(--br)}
.ptag.pegi{font-weight:700;font-size:14px}.ptag.lic{color:var(--mu);font-size:12.5px;font-weight:400}.ptag.free{border-color:rgba(50,205,100,.4);color:rgba(50,205,100,.95);background:rgba(50,205,100,.08)}
.psec{display:flex;flex-direction:column;gap:9px}.plbl{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--mu)}.prow{display:flex;flex-wrap:wrap;gap:16px}
.pico{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:50px}.pico svg{opacity:.8;width:24px;height:24px}.pico span{font-size:12px;font-weight:500;color:var(--mu);text-align:center;line-height:1.25;white-space:nowrap}
#pbot{border-top:1px solid var(--bd);padding:16px 24px;display:flex;align-items:flex-end;gap:16px;flex-shrink:0}
#pdsc{flex:1;font-size:15px;color:var(--mu);line-height:1.6;max-height:90px;overflow-y:auto}
#pcls{position:absolute;top:10px;right:10px;width:30px;height:30px;background:rgba(0,0,0,.6);border:1px solid var(--bd2);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--mu);font-size:14px;z-index:10;transition:all .15s;backdrop-filter:blur(4px)}
#pcls:hover{background:#e02a2a;border-color:#e02a2a;color:#fff}
#emp{display:none;text-align:center;padding:48px 20px;color:var(--mu);font-size:15px}
#emp p{font-family:var(--ff);font-size:21px;font-weight:700;letter-spacing:-.3px;color:var(--tx);margin-bottom:7px}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--s3);border-radius:2px}
@media(max-width:600px){
  body{font-size:14px}
  #hdr{padding:0 12px}#hi{height:56px;gap:10px}#sw{max-width:none;flex:1}#gc{display:none}
  #ln{font-size:20px}#si{font-size:15px;padding:9px 13px 9px 38px}
  #fi{height:40px;padding:0 12px;gap:5px}#main{padding:16px 12px 40px}
  #fb::before,#fb::after{width:22px}
  #lgb{padding:6px 9px;font-size:12px}#lgb .lgn{display:none}
  .glg{grid-template-columns:repeat(2,1fr);gap:11px}.gmd{grid-template-columns:repeat(2,1fr);gap:11px}.gsm{grid-template-columns:repeat(2,1fr);gap:10px}.tit{font-size:22px}
  .ct{font-size:15px}.cp{font-size:12px}.ctg{font-size:10px}
  #pov{padding:0;align-items:flex-end}#pop{border-radius:16px 16px 0 0;max-height:95vh;max-width:100%}
  #pt{flex-direction:column}#pcol{--pcp:12px;width:100%;padding:var(--pcp) var(--pcp) 0}#pim{max-height:40vh}#pph{aspect-ratio:16/9}
  #pmeta{padding:16px 16px 12px;gap:12px}#ptit{font-size:24px}#pbot{padding:14px 16px;flex-wrap:wrap;gap:10px}
  #pdsc{max-height:70px;font-size:14px}
}
</style>
</head>

s. Descubra a história de dois irmãos de sangue que perseguem o grande e mau John."},{"l":"Incluído","d":"Colete moedas enquanto faz as acrobacias mais incríveis com sua bicicleta e chegue à linha de chegada sem sofrer nenhum acidente"},{"l":"Incluído","d":"Prepare seu esquadrão, escolha seus integrantes e equipamentos e enfrentem juntos as missões mais difíceis a bordo de um bombardeiro neste simulador estratégico de sobrevivência."},{"l":"Incluído","d":"É hora de limpar a tela desses blocos irritantes. Use esferas e física para fazê-las saltar até que os cenários estejam limpos"},{"l":"Incluído","d":"O oeste é um lugar difícil e perigoso, mas ainda mais se você adicionar bombas! Mate seus inimigos com todos os tipos de explosões; Lute contra seus amigos para ser o último sobrevivente."},{"l":"Incluído","d":"Cuidadoso! Os boxeadores estão cercando você! Acabe com eles com seus melhores sucessos neste beat'em up"},{"l":"Incluído","d":"Relaxe, desconecte-se de tudo e divirta-se atirando bolas para quebrar todos os tijolos e assim superar níveis"},{"l":"Incluído","d":"Torne-se um engenheiro de pontes e estradas, criando suas próprias estruturas em 64 níveis diferentes. Eles suportarão o peso de carros e caminhões?"},{"l":"Incluído","d":"Sua namorada foi sequestrada pelo malvado Super Drunk! Torne-se um pequeno dragão e passe por 100 níveis cheios de monstros, pois no último eles te aguardam ela e o vilão que você terá que derrotar."},{"l":"Incluído","d":"Procurando por uma ilha do tesouro? Bem, tome cuidado, porque você não é o único! Dispare seus canhões contra tudo que estiver no seu caminho"},{"l":"Incluído","d":"Você é o cozinheiro da casa? Desfrute de um clássico onde você terá que superar níveis enquanto consegue os ingredientes para preparar o melhor hambúrguer"},{"l":"Incluído","d":"A gangue mais perigosa infestou as ruas da cidade... acabe com eles percorrendo os níveis deste beat'em up com os punhos e todas as armas que encontrar pelo caminho."},{"l":"Incluído","d":"A humanidade foi forçada a refugiar-se e, 600 anos depois, regressa à superfície. O mundo é dominado por dinossauros e algumas pessoas muito gananciosas querem estabelecer uma nova ordem mundial."},{"l":"Incluído","d":"Arme-se até os dentes e lute contra hordas de inimigos variados neste jogo de ação retrô lado a lado"},{"l":"Incluído","d":"Embarque em uma jornada por vastas paisagens em Caravan SandWitch, uma cativante aventura de exploração baseada em narrativas."},{"l":"Incluído","d":"Num campo cheio de fungos e insetos que querem te matar, sua missão será matar a centopéia, mas... Cuidado! Cada vez que você atirar, ele se multiplicará!"},{"l":"Incluído","d":"Demonstre suas habilidades ninja de infiltração e sabotagem neste jogo de quebra-cabeça baseado em turnos"},{"l":"Incluído","d":"O Natal está chegando. Torne-se Papai Noel, dê ordens aos seus duendes e garanta que os presentes cheguem a tempo neste simples jogo de gerenciamento"},{"l":"Incluído","d":"Mergulhe neste jogo simples e colorido, perfeito para passar o tempo em suas viagens diárias"},{"l":"Incluído","d":"Coloque-se no lugar do grande Circo Charlie e supere todos os espetáculos de circo até obter a maior pontuação"},{"l":"Incluído","d":"Você quer jogar um jogo rápido? Vença todos os níveis e ganhe estrelas no clássico Hangman"},{"l":"Incluído","d":"Embarque em uma jornada fantástica e enfrente dragões com habilidades únicas"},{"l":"Incluído","d":"Afie seus reflexos, Chef! Prepare o máximo de hambúrgueres que puder e vença 100 níveis com a melhor pontuação"},{"l":"Incluído","d":"Os alienígenas estão vindo para destruir a Terra? Pois bem, você terá que destruí-los ao ritmo do rock'n'roll neste beat'em-up com gráficos retrô como os dos anos 80."},{"l":"Incluído","d":"Obtenha a combinação perfeita misturando cores e colocando espelhos e lasers neste relaxante jogo de quebra-cabeças"},{"l":"Incluído","d":"A selva está cheia de perigos! Controle um explorador incansável atravessando uma selva cheia de macacos até encontrar o gorila que ateou fogo em seu acampamento"},{"l":"Incluído","d":"Combine os animais neste jogo desafiador com 6 modos de jogo e 40 animais. Você pode vincular todos eles?"},{"l":"Incluído","d":"Se você é fã de astronomia, neste jogo terá que criar constelações com apenas uma linha. Quão habilidoso você é?"},{"l":"Incluído","d":"Contra, curta um dos maiores clássicos do tiro em que, com sua unidade de elite, você terá que acabar com a organização maligna que conspira contra o mundo."},{"l":"Incluído","d":"Coromon é uma versão moderna do gênero clássico de domesticação de monstros. Domine o Coromon e explore um vasto mundo cheio de coisas emocionantes. Ninguém disse que ser um Investigador de Batalha era fácil!"},{"l":"Incluído","d":"Entre neste jogo de plataforma louco e desafiador como um animal donut rolante que usa foguetes para salvar uma xícara... O que pode dar errado?"},{"l":"Incluído","d":"Comande seus exércitos contra hordas implacáveis de monstros e use feitiços poderosos para defender o reino"},{"l":"Incluído","d":"Os recursos da Terra se esgotaram e você, um único astronauta na Lua, tem a missão de salvá-la nesta aventura de ficção científica em um futuro pós-apocalíptico."},{"l":"Incluído","d":"Cave túneis, fuja, bata pedras e mate inúmeros inimigos para ganhar pontos e se tornar campeão neste divertido clássico."},{"l":"Incluído","d":"DoDonPachi ressuscita após uma morte feliz com modos suficientes para satisfazer tanto o jogador iniciante quanto o experiente. Esta noite jantaremos no Bullet Hell!"},{"l":"Incluído","d":"Relembre jogos autênticos em família com os clássicos e divertidos Dominós"},{"l":"Incluído","d":"Você gosta de jogos simples? Bom, porque aqui você só terá que mover uma bolinha e evitar a borda."},{"l":"Incluído","d":"O mundo caiu no caos; A polícia só patrulha durante o dia e a noite pertence às gangues e ao crime organizado. Koga Shuko é um empresário corrupto que deseja o poder absoluto."},{"l":"Incluído","d":"Coloque-se no lugar de uma das criaturas mais míticas e salve seus amados monstros do ataque dos aldeões"},{"l":"Incluído","d":"Segure-se bem nas costas do seu dragão e prepare-se para uma aventura cheia de ação neste clássico jogo de tiro arcade."},{"l":"Incluído","d":"Mesclar blocos idênticos e criar reações em cadeia para obter a pontuação mais alta possível!"},{"l":"Incluído","d":"Uma masmorra em perigo! Construa, gerencie e defenda sua torre no universo de fantasia heróica e satírica de Dungeon of Naheulbeuk. De um negócio em dificuldades a um covil infame."},{"l":"Incluído","d":"Darokin era um lugar tranquilo... até que os monstros decidiram se organizar e atacar. Usando 4 heróis e suas diversas habilidades, sua missão é restaurar a paz no mundo."},{"l":"Incluído","d":"Embarque em uma aventura em busca do Vale da Eternidade nesta plataforma com geração aleatória de níveis, construa estruturas e crie equipamentos para derrotar seus inimigos."},{"l":"Incluído","d":"Os alienígenas estão chegando aqui em ondas imparáveis. Sua missão é derrubá-los com todo o poder de fogo que puder reunir."},{"l":"Incluído","d":"Devore todos os círculos que aparecerem e fiquem cada vez maiores. Quão grande você pode fazer seu círculo?"},{"l":"Incluído","d":"O trabalho de espionagem nunca foi dos mais seguros... E ainda mais quando você foi descoberto! Fuja dos seus perseguidores enquanto coleta documentos secretos."},{"l":"Incluído","d":"Se os emojis sempre representam o seu humor, neste jogo você terá que encontrar todos eles e conectar os que são iguais com apenas três linhas"},{"l":"Incluído","d":"O tempo passa para todos, mas a vontade de aventura não desaparece. Coloque-se no lugar de Sir Arthur e procure as esferas mágicas para alcançar a vida eterna."},{"l":"Incluído","d":"Com referências a filmes de terror e séries B dos anos 80, Everdark nos leva a uma cidade infestada de vampiros. Com estacas, alho, cruzes, água benta e um arsenal de armas de fogo e armas brancas, abriremos caminho neste jogo de tiro com tons do clássico terror de sobrevivência e uma atmosfera opressiva."},{"l":"Incluído","d":"Você conseguirá se classificar entre os três primeiros para chegar ao campeonato Excitebike? Competir contra outros motociclistas e contra o relógio em sua bicicleta suja até bater o recorde de tempo em cada pista para se tornar campeão."},{"l":"Incluído","d":"Aproveite este viciante jogo de puzzles, onde você terá que atravessar o tabuleiro evitando formas geométricas"},{"l":"Incluído","d":"Aproveite este jogo simples, mas desafiador, onde você terá que superar obstáculos para mover o bloco vermelho."},{"l":"Incluído","d":"Elimine todas as bases e enfrente o chefe final para avançar para o próximo nível na Fantasy Zone."},{"l":"Incluído","d":"Se o seu sonho sempre foi se tornar uma estilista de elite, agora você pode vestir modelos como superestrelas!"},{"l":"Incluído","d":"Vista seu roupão de podólogo e resolva todo tipo de problema nos pés de seus pacientes. A saúde deles depende de você!"},{"l":"Incluído","d":"Pronto para se tornar o melhor lutador Spinner? Lute contra 4 oponentes no círculo e saia vitorioso"},{"l":"Incluído","d":"O jogo que os mais pequenos adoram! Complete as caixas preenchendo-as com suas respectivas cores"},{"l":"Incluído","d":"Você está pronto para jogar este fantástico jogo de quebra-cabeça? É um jogo fácil, não se preocupe! Você está pronto para superar o desafio em centenas de níveis?"},{"l":"Incluído","d":"Saia pelas ruas de Metro City e lute contra a gangue criminosa Mad Gear para resgatar a filha do prefeito neste clássico jogo de luta, cheio de referências a outros jogos e baseado no universo Street Fighter."},{"l":"Incluído","d":"Prepare toda a habilidade que você possui ao atirar em segmentos da mesma cor. Se for de uma cor diferente... Você perde!"},{"l":"Incluído","d":"Acelere por Flatland neste jogo de plataforma hardcore minimalista e neon"},{"l":"Incluído","d":"Ligue pontos da mesma cor em 100 níveis neste jogo de quebra-cabeça estilo neon"},{"l":"Incluído","d":"Atenda a chamada para uma base de mineração em Marte como o engenheiro Jack Leary e procure a tripulação desaparecida. Explore o complexo mineiro e alcance o clímax desta experiência de suspense narrativo."},{"l":"Incluído","d":"Suba no Blast Fighter e atire até matar todos os alienígenas que te atacam em formação"},{"l":"Incluído","d":"Entre na sua nave espacial e prepare-se para abater enxames enormes e contínuos de alienígenas que querem derrubar você. Tenha cuidado, alguns são kamikazes!"},{"l":"Incluído","d":"Desenhe linhas para fechar áreas e evite o chefe de cada tela até descobrir a silhueta escondida no fundo com este jogo diferente e clássico."},{"l":"Incluído","d":"De ganso em ganso, e atiro porque é a minha vez! Relembre as brincadeiras mais engraçadas da sua infância"},{"l":"Incluído","d":"As ruas são suas! Uma gangue maligna está aterrorizando Nova York, então você deve trazer a paz de volta neste clássico beat-em up."},{"l":"Incluído","d":"Enfrente o maior desafio de memória! Um jogo de cartas com 120 níveis e até 40 cartas para memorizar"},{"l":"Incluído","d":"Corra por Cretácia com seu dinossauro favorito em um campeonato de kart quase tão grande quanto o apetite de um Gigantossauro!"},{"l":"Incluído","d":"Entre no mundo de God of Light, explore-o e desfrute de seus excelentes gráficos e trilha sonora enquanto resolve quebra-cabeças baseados em física."},{"l":"Incluído","d":"Assuma o controle de sua nave espacial e complete 5 missões desafiadoras enquanto luta contra naves alienígenas."},{"l":"Incluído","d":"Assuma o papel de um soldado de operações especiais dos Estados Unidos que se infiltra numa base militar inimiga que, como o nome sugere, se assemelha a um complexo militar soviético."},{"l":"Incluído","d":"Ajude Gumball e Darwin a vencer as eleições escolares em Vote for Gumball! Resolva quebra-cabeças, colete itens e tire fotos para a campanha nesta divertida aventura."},{"l":"Incluído","d":"Pegue todas as armas que puder carregar e atire em tudo que se move neste clássico run&gun"},{"l":"Incluído","d":"Ponha as mãos em todo um arsenal de armas e veículos para enfrentar as tropas inimigas que procuram destruir você."},{"l":"Incluído","d":"Chegar em casa depois de um árduo dia de trabalho e não ter casa... Vingança! Pegue seu martelo e acabe com a companhia maligna que demoliu sua casa."},{"l":"Incluído","d":"Aproveite a fazenda neste divertido fliperama, onde você terá que cultivar e coletar frutas e vegetais"},{"l":"Incluído","d":"Os vegetais precisam de água! É hora de calçar as luvas e conectar os canos antes que seja tarde demais"},{"l":"Incluído","d":"O handebol atinge um novo patamar! Competir contra outras equipes, usar golpes especiais e vencer a qualquer custo"},{"l":"Incluído","d":"Coloque o tijolo hexa nas lacunas de concreto para destruir fileiras inteiras!"},{"l":"Incluído","d":"Destrua os blocos que caem do topo da tela antes que eles caiam no chão e acumule a maior pontuação"},{"l":"Incluído","d":"Relaxe, use a lógica e resolva quebra-cabeças em 40 níveis em um tabuleiro hexagonal"},{"l":"Requer licença Steam","d":"Hogwarts Legacy é um RPG de ação envolvente e de mundo aberto. Agora você pode assumir o controle da ação e ser o centro de sua própria aventura no mundo dos bruxos."},{"l":"Incluído","d":"Viaje para Neverland e prepare-se para espalhar lenha entre os capangas do Capitão Gancho neste clássico beat-em'up legal e graficamente bonito."},{"l":"Incluído","d":"Tome as rédeas com força e vença os melhores jóqueis nas corridas de cavalos para se tornar o maior campeão"},{"l":"Incluído","d":"Hotshot Racing é um jogo de corrida estilo arcade em ritmo acelerado que combina drifting, gráficos retrô nítidos e uma incrível sensação de velocidade para criar uma experiência emocionante."},{"l":"Incluído","d":"Num mundo cinzento e triste, você tem o poder de trazê-lo de volta à vida desenterrando fragmentos coloridos enquanto via /* Idioma: elección guardada > idioma del navegador > idioma con el que se generó.
   navigator.languages viene como "es-AR" / "pt-BR", así que alcanza el prefijo. */
function pickLang(){
  try{const s=localStorage.getItem(LS_KEY);if(s&&AVAIL.indexOf(s)>=0)return s;}catch(e){}
  const navs=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||""];
  for(let i=0;i<navs.length;i++){const c=(navs[i]||"").slice(0,2).toUpperCase();if(AVAIL.indexOf(c)>=0)return c;}
  return AVAIL.indexOf(DEF_LANG)>=0?DEF_LANG:AVAIL[0];
}

function ltLabel(k){return k==="steam"?"Steam":k==="epic"?"Epic Games":k==="battlenet"?"Battle.net":k==="incluido"?T.included:T.other;}
function gLabel(k){return (GLBL[LANG]&&GLBL[LANG][k])||(GLBL.ES&&GLBL.ES[k])||k;}

function chipRow(box,pairs,fld,extra){box.innerHTML="";pairs.sort((a,b)=>a[1].localeCompare(b[1],undefined,{sensitivity:"base"})).forEach(([k,lb])=>{const d=document.createElement("div");d.className="chip"+(AF[fld].indexOf(k)>=0?" on":"");d.textContent=lb;d.dataset.f=fld;d.dataset.v=k;d.onclick=()=>{tc(d);if(extra)extra();};box.appendChild(d);});}

function match(g){const q=document.getElementById("si").value.toLowerCase();if(q&&!g.t.toLowerCase().includes(q)&&!g.p.toLowerCase().includes(q)&&!g.gs.some(x=>x.toLowerCase().includes(q)))return false;if(AF.genre.length&&!g.gk.some(x=>AF.genre.includes(x)))return false;if(AF.lic.length&&!AF.lic.includes(g.lt))return false;if(AF.dev.length&&!AF.dev.every(d=>(d==="pc"&&g.pc)||(d==="mobile"&&g.mob)||(d==="tv"&&g.tv)))return false;if(AF.ctrl.length&&!AF.ctrl.every(c=>(c==="gamepad"&&g.gp)||(c==="teclado"&&g.tk)||(c==="touch"&&g.ts)))return false;if(AF.pl.length&&!AF.pl.every(p=>(p==="single"&&g.sp)||(p==="multi"&&g.mp)||(p==="online"&&g.mo)))return false;return true;}

function mkcard(g){const d=document.createElement("div");d.className="card";const img=g.i?`<img class="cbg" src="${g.i}" loading="lazy" aria-hidden="true" onerror="this.style.display='none'"/><img class="ci" src="${g.i}" loading="lazy" onerror="this.style.display='none';this.previousElementSibling.style.display='none';this.nextElementSibling.style.display='flex'"/><div class="cph" style="display:none">${g.t[0]}</div>`:`<div class="cph">${g.t[0]}</div>`;d.innerHTML=`<div class="ciw">${img}<div class="cov"></div>${g.nv?`<div class="cnv">${T.newBadge}</div>`:""}<div class="cpe">${g.pe}+</div></div><div class="cb"><div class="ct">${g.t}</div><div class="cp">${g.p}</div><div class="ctgs">${g.gs.map(x=>`<span class="ctg g">${x}</span>`).join("")}${g.free?`<span class="ctg f">${T.freeBadge}</span>`:""}<span class="ctg">${g.ltl}</span></div><div class="cic">${ib(g.sp,mksvg(D.single,15),"1P")}${ib(g.mp,mksvg(D.multi,15),T.multiplayer)}${ib(g.mo,mksvg(D.online,15),T.online)}${ib(g.pc,mksvg(D.pc,15),"PC")}${ib(g.mob,mksvg(D.mobile,15),T.mobile)}${ib(g.tv,mksvg(D.tv,15),"TV")}${ib(g.gp,mksvg(D.gamepad,15),"Pad")}${ib(g.ts,mksvg(D.touch,15),"Touch")}</div></div>`;d.onclick=()=>op(g);return d;}
function rend(gid,sid,games,cid){const gr=document.getElementById(gid),sec=document.getElementById(sid);gr.innerHTML="";sec.style.display=games.length?"block":"none";document.getElementById(cid).textContent=games.length?`${games.length} ${T.games}`:"";games.forEach(g=>gr.appendChild(mkcard(g)));}
function run(){ucl();const filt=GV.filter(match);const isF=document.getElementById("si").value||Object.values(AF).some(a=>a.length);rend("gnv","snv",isF?[]:filt.filter(g=>g.nv),"cnv");rend("gde","sde",isF?[]:filt.filter(g=>g.de),"cde");rend("gtp","stp",isF?[]:filt.filter(g=>g.mj),"ctp");rend("gal","sal",filt,"cal");document.getElementById("atit").textContent=isF?T.results:T.all;document.getElementById("gc").textContent=`${filt.length} ${T.games}`;document.getElementById("emp").style.display=filt.length===0?"block":"none";}
function picoRow(rowId,secId,items){const html=items.filter(x=>x.show).map(x=>`<div class="pico">${mksvg(D[x.key])}<span>${x.label}</span></div>`).join("");document.getElementById(rowId).innerHTML=html;document.getElementById(secId).style.display=html?"flex":"none";}
function op(g){const iw=document.getElementById("piw"),im=document.getElementById("pim"),bg=document.getElementById("pbg"),ph=document.getElementById("pph");if(g.i){im.src=g.i;bg.src=g.i;iw.style.display="block";ph.style.display="none";}else{iw.style.display="none";ph.style.display="flex";ph.textContent=g.t[0];}document.getElementById("pnvb").style.display=g.nv?"block":"none";document.getElementById("ptit").textContent=g.t;document.getElementById("ppub").textContent=g.p;document.getElementById("ptgs").innerHTML=`${g.gs.map(x=>`<span class="ptag genre">${x}</span>`).join("")}<span class="ptag pegi">${T.pegi} ${g.pe}+</span><span class="ptag lic">${g.l}</span>${g.free?`<span class="ptag free">${T.free}</span>`:""}`;picoRow("rjug","sjug",[{show:g.sp,key:"single",label:T.singlePlayer},{show:g.mp,key:"multi",label:T.multiplayer},{show:g.mo,key:"online",label:T.online}]);picoRow("rdev","sdev",[{show:g.pc,key:"pc",label:"PC"},{show:g.mob,key:"mobile",label:T.mobile},{show:g.tv,key:"tv",label:"TV"}]);picoRow("rctrl","sctrl",[{show:g.gp,key:"gamepad",label:"Gamepad"},{show:g.tk,key:"teclado",label:T.keyboard},{show:g.ts,key:"touch",label:"Touch"}]);document.getElementById("pdsc").textContent=g.d;document.getElementById("pov").classList.add("open");}
function cp(){document.getElementById("pov").classList.remove("open");}
document.addEventListener("keydown",e=>{if(e.key==="Escape")cp();});
/* ── IDIOMA ───────────────────────────────────────────────────────────────
   Todo el texto estatico lleva data-i18n / data-i18n-ph, asi cambiar de idioma
   no requiere regenerar el HTML: se reescriben los nodos y se re-renderiza. */
function applyI18N(){
  document.documentElement.lang=LANG.toLowerCase();
  document.title=BASE_TITLE+" — "+T.catalog;
  document.querySelectorAll("[data-i18n]").forEach(function(el){var k=el.getAttribute("data-i18n");if(T[k]!==undefined)el.textContent=T[k];});
  document.querySelectorAll("[data-i18n-ph]").forEach(function(el){var k=el.getAttribute("data-i18n-ph");if(T[k]!==undefined)el.placeholder=T[k];});
  document.getElementById("lgc").innerHTML=LANG+'<span class="lgn"> · '+(LNAMES[LANG]||LANG)+'</span>';
}
let lgOpen=false;
function tlg(e){e.stopPropagation();lgOpen=!lgOpen;document.getElementById("lgm").classList.toggle("open",lgOpen);}
function buildLangMenu(){
  var w=document.getElementById("lgw"),m=document.getElementById("lgm");
  if(AVAIL.length<2)return;   /* catalogo monolingue -> no se muestra el selector */
  w.classList.add("on");m.innerHTML="";
  AVAIL.forEach(function(c){var b=document.createElement("button");b.type="button";b.className="lgo"+(c===LANG?" on":"");b.textContent=LNAMES[c]||c;b.onclick=function(ev){ev.stopPropagation();setLang(c);};m.appendChild(b);});
}
function setLang(c){
  lgOpen=false;document.getElementById("lgm").classList.remove("open");
  if(AVAIL.indexOf(c)<0||c===LANG)return;
  LANG=c;T=T_ALL[LANG];
  try{localStorage.setItem(LS_KEY,c);}catch(e){}
  buildGV();applyI18N();buildChips();buildLangMenu();ugb();run();updFades();
}

/* ── BARRA DE FILTROS: scroll horizontal en mobile y PC ──────────────────
   Mobile: scroll tactil nativo. PC: rueda del mouse, arrastre y flechas.
   Las clases ovl/ovr encienden el degradado y las flechas de cada borde. */
const fb=document.getElementById("fb"),fi=document.getElementById("fi");
function updFades(){var max=fi.scrollWidth-fi.clientWidth;fb.classList.toggle("ovl",fi.scrollLeft>2);fb.classList.toggle("ovr",max>2&&fi.scrollLeft<max-2);}
function fscroll(dir){fi.scrollBy({left:dir*Math.max(150,fi.clientWidth*0.6),behavior:"smooth"});}
fi.addEventListener("scroll",updFades,{passive:true});
window.addEventListener("resize",updFades);
/* La rueda del mouse es vertical: se traduce a horizontal. Si el gesto ya viene
   horizontal (trackpad), se deja el comportamiento nativo. */
fi.addEventListener("wheel",function(e){
  var max=fi.scrollWidth-fi.clientWidth;if(max<=2)return;
  if(Math.abs(e.deltaX)>=Math.abs(e.deltaY))return;
  e.preventDefault();fi.scrollLeft+=e.deltaY;
},{passive:false});
let drag=null,justDragged=false;
fi.addEventListener("pointerdown",function(e){if(e.pointerType!=="mouse"||e.button!==0)return;drag={x:e.clientX,l:fi.scrollLeft,moved:false};});
window.addEventListener("pointermove",function(e){if(!drag)return;var d=e.clientX-drag.x;if(!drag.moved&&Math.abs(d)<4)return;drag.moved=true;fi.classList.add("grab");fi.scrollLeft=drag.l-d;});
window.addEventListener("pointerup",function(){if(!drag)return;if(drag.moved){justDragged=true;setTimeout(function(){justDragged=false;},0);}fi.classList.remove("grab");drag=null;});

buildGV();applyI18N();buildChips();buildLangMenu();ugb();
run();
updFades();requestAnimationFrame(updFades);
</script>
</body>
</html>
